spring.application.name=server
server.port=${PORT:5000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.sql.init.schema.locations=classpath:schema.sql
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDB103Dialect

app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin_password}

client.url=${CLIENT_URL:http://localhost:5173}

gemini.api.key=${GEMINI_KEY:}
gemini.models=${GEMINI_MODELS:gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash,gemini-flash-latest}

